[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ayman-os-agent"
version = "0.2.0"
description = "A smart operating-system agent with file, shell, AI, scheduling, reporting, and notifications"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Ayman" }]
dependencies = [
  "boto3>=1.34.0",
  "python-telegram-bot>=21.0",
  "openpyxl>=3.1.5",
]

[project.scripts]
ayman-os-agent = "ayman_os_agent.agent:main"
ayman-os-agent-bot = "ayman_os_agent.telegram_bot:main"
