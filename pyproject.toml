[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ayman-os-agent"
version = "0.3.0"
description = "Study Mentor OS agent: Telegram study mentor with Google Sheets as the database, AI tool-calling, and scheduled reports"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Ayman" }]
dependencies = [
  "python-telegram-bot>=21.0",
  "openpyxl>=3.1.5",
  "boto3>=1.34.116",
  "gspread>=6.0.0",
  "APScheduler>=3.10,<4",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
ayman-os-agent = "ayman_os_agent.agent:main"
ayman-os-agent-bot = "ayman_os_agent.telegram_bot:main"

[tool.ruff]
line-length = 150
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
